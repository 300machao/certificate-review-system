# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Windows Python 3.12"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

if ([string]::IsNullOrWhiteSpace($env:CODEX_SOURCE_TREE_PATH)) {
    throw "CODEX_SOURCE_TREE_PATH is required to locate the project's existing .venv."
}

$codexSourcePython = Join-Path $env:CODEX_SOURCE_TREE_PATH ".venv\Scripts\python.exe"
if (-not (Test-Path -LiteralPath $codexSourcePython -PathType Leaf)) {
    throw "Project source .venv is missing: $codexSourcePython"
}

$codexRequiredPython = (Get-Content -LiteralPath ".\.python-version" -Raw).Trim()
$codexSourceVersion = & $codexSourcePython -c "import platform; print(platform.python_version())"
if ($LASTEXITCODE -ne 0 -or $codexSourceVersion.Trim() -ne $codexRequiredPython) {
    throw "Project source .venv must use Python $codexRequiredPython."
}

if (-not (Test-Path -LiteralPath ".\.venv\Scripts\python.exe" -PathType Leaf)) {
    & $codexSourcePython -m venv .venv
    if ($LASTEXITCODE -ne 0) {
        throw "Failed to create the worktree .venv."
    }
}

& .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r .\requirements.lock.txt
if ($LASTEXITCODE -ne 0) {
    throw "Failed to install requirements.lock.txt into the worktree .venv."
}

& .\.venv\Scripts\python.exe -m pip check
if ($LASTEXITCODE -ne 0) {
    throw "The worktree .venv failed pip check."
}
'''

[[actions]]
name = "Safe tests"
icon = "test"
command = '''
$ErrorActionPreference = "Stop"
$env:CERT_MODEL_MODE = "disabled"
$codexTestDataDir = Join-Path ([System.IO.Path]::GetTempPath()) ("certificate-review-tests-" + [guid]::NewGuid().ToString("N"))
$env:CERT_DATA_DIR = $codexTestDataDir

& .\.venv\Scripts\python.exe -m pytest -q
if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

node --check .\static\app.js
if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}
'''
platform = "win32"
